<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — USAGCD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Libre+Franklin:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#10233f;--paper:#f7f5f0;--blue:#2457e6;--red:#b42335;--ink:#252b33;--muted:#536075}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--paper);color:var(--ink);font-family:"Libre Franklin",system-ui,sans-serif;text-align:center;padding:24px}
.logo{font-family:"Oswald",sans-serif;font-weight:700;font-size:42px;letter-spacing:-1.5px;color:var(--navy);position:relative;padding-bottom:8px;margin-bottom:28px}
.logo span{color:var(--red)}
.logo:after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:62px;height:4px;background:var(--red)}
h1{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(28px,5vw,40px);color:var(--navy);margin:0 0 10px}
p{color:var(--muted);font-size:16px;max-width:44ch;margin:0 0 24px}
a.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:12px 20px;border-radius:3px}
a.btn:hover{background:#951a28}
</style>
</head>
<body>
  <div class="logo">USAG<span>CD</span></div>
  <h1>Page not found</h1>
  <p>The page you’re looking for isn’t here. It may have moved, or the link may be out of date.</p>
  <a class="btn" href="/">Back to home</a>
</body>
</html>
